# Phase T: joint transmission+cooling via wedge taper.
# Maximize exit brightness subject to a hard transmission floor of 0.55.
config_dir: ../hfofo
input_file: hfofo.in
runner: {backend: docker, image: ghcr.io/lawrenceleejr/g4beamline:main, timeout: 1200}
parameters:
  BLS:             {low: 20.0, high: 24.0, nominal: 21.4}
  Grad:            {low: 22.0, high: 30.0, nominal: 26.0}
  Grad0:           {low: 17.0, high: 27.0, nominal: 21.0}
  delf:            {low: 0.0,  high: 0.08, nominal: 0.02}
  pitchFactor:     {low: 0.70, high: 1.20, nominal: 1.0}
  dtRF:            {low: -0.20, high: 0.20, nominal: 0.0}
  wedgeScaleStart: {low: 0.40, high: 2.00, nominal: 0.8}
  wedgeScaleEnd:   {low: 1.00, high: 4.00, nominal: 3.0}
  irisScale:       {low: 1.00, high: 1.30, nominal: 1.1}
objective:
  mode: brightness
  n_events: 400
  p0: 247.5
  p_low: 100.0
  p_high: 400.0
  transmission_floor: 0.55
  transmission_weight: 1.0
  cooling_weight: 1.0
  entrance_detector: out2.txt
  exit_detector: out31.txt
  trans_entrance_detector: out1.txt
optimizer: {method: bayes, n_trials: 70, n_jobs: 3, seed: 17, storage: auto}
out_dir: results/phaseT
